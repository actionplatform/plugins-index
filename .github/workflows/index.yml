name: Index

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_index.py
      - run: git diff --exit-code index.json || (echo "::error::index.json is stale — run scripts/build_index.py" && exit 1)
